name: Build and Deploy to GCP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_HOST: ${{ secrets.GCP_HOST }}
      GCP_USERNAME: ${{ secrets.GCP_USERNAME }}
      GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
      ENV_FILE: ${{ secrets.ENV_FILE }}

    steps:
      - uses: actions/checkout@v3

      - name: Verify Secrets
        run: |
          if [ -z "$GCP_HOST" ] || [ -z "$GCP_USERNAME" ] || [ -z "$GCP_SSH_KEY" ]; then
            echo "❌ Required secrets are missing in GitHub Settings."
            exit 1
          fi

      - name: Create .env
        run: echo "$ENV_FILE" > .env

      - name: Pack Application
        run: tar -czf deploy.tar.gz --exclude='node_modules' --exclude='*/node_modules' --exclude='.git' Backend Pages Scripts Styles nginx docker-compose.prod.yml package.json schema.sql init_auth.sql Dockerfile index.js formulary.json .env DEPLOYMENT_GUIDE.md SECURITY.md

      - name: Stop & Clean Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.GCP_HOST }}
          username: ${{ env.GCP_USERNAME }}
          key: ${{ env.GCP_SSH_KEY }}
          script: |
            mkdir -p ~/medmitra
            sudo -n docker-compose -f ~/medmitra/docker-compose.prod.yml down || true
            sudo -n docker ps -aq --filter name=medmitra | xargs -r sudo -n docker rm -f || true
            sudo -n docker system prune -af --volumes || true
            rm -rf ~/medmitra/*

      - name: Upload Application
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ env.GCP_HOST }}
          username: ${{ env.GCP_USERNAME }}
          key: ${{ env.GCP_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "~/medmitra"

      - name: Extract & Launch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.GCP_HOST }}
          username: ${{ env.GCP_USERNAME }}
          key: ${{ env.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/medmitra
            tar -xzf deploy.tar.gz
            
            # Create Nginx Config (Using 127.0.0.1 instead of localhost for stability)
            cat << 'EOF' > medmitra_site.conf
            server {
                listen 80;
                server_name 136-116-93-95.sslip.io;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl;
                server_name 136-116-93-95.sslip.io;

                ssl_certificate /etc/letsencrypt/live/136-116-93-95.sslip.io/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/136-116-93-95.sslip.io/privkey.pem;

                # Global CORS Fix
                location / {
                    # Handle Preflight OPTIONS directly
                    if ($request_method = 'OPTIONS') {
                        add_header 'Access-Control-Allow-Origin' 'https://sinharitesh28.github.io' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
                        add_header 'Access-Control-Allow-Credentials' 'true' always;
                        add_header 'Content-Length' 0;
                        return 204;
                    }

                    proxy_pass http://127.0.0.1:3000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 60s;
                    proxy_read_timeout 60s;

                    # Ensure headers are passed through or added if missing (Safety Net)
                    # Note: We rely mainly on the Node App, but this helps debug 502s
                    # add_header 'Access-Control-Allow-Origin' 'https://sinharitesh28.github.io' always;
                    # add_header 'Access-Control-Allow-Credentials' 'true' always;
                }
            }
            EOF
            
            # Remove default config if exists
            sudo -n rm -f /etc/nginx/sites-enabled/default
            sudo -n cp medmitra_site.conf /etc/nginx/sites-available/medmitra
            sudo -n ln -sf /etc/nginx/sites-available/medmitra /etc/nginx/sites-enabled/medmitra
            sudo -n nginx -t && sudo -n systemctl restart nginx
            
            # Clean Docker Cache to prevent build errors
            sudo -n docker builder prune -af || true
            
            # Start Containers (Force Clean Build)
            sudo -n docker-compose -f docker-compose.prod.yml build --no-cache app
            sudo -n docker-compose -f docker-compose.prod.yml up -d

            echo "Waiting for startup..."
            sleep 10
            sudo -n docker ps
            echo "--- APP LOGS ---"
            sudo -n docker logs medmitra_app --tail 50