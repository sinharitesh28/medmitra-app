<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedMitra - Registration</title>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/auth-guard.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../Scripts/i18n.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#1B211A', secondary: '#628141', tertiary: '#8BAE66', quaternary: '#EBD5AB' }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .suggestions-list::-webkit-scrollbar { width: 5px; }
        .suggestions-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-primary text-gray-300 w-64 flex-shrink-0 fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out z-50 flex flex-col shadow-2xl">
            <div class="h-20 flex items-center justify-center border-b border-gray-800/50 bg-primary/50 backdrop-blur-sm">
                <h1 class="text-2xl font-bold tracking-widest text-quaternary flex items-center gap-3">
                    <span class="text-3xl">⚕️</span> MedMitra
                </h1>
            </div>
            <nav class="flex-1 px-4 py-8 space-y-2 overflow-y-auto no-scrollbar">
                <a href="registration.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70 group-hover:opacity-100 transition-opacity">📝</span><span class="font-medium tracking-wide">Registration</span>
                </a>
                <a href="assigned.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70 group-hover:opacity-100 transition-opacity">📅</span><span class="font-medium tracking-wide">Assigned</span>
                </a>
                <a href="reminders.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70 group-hover:opacity-100 transition-opacity">🔔</span><span class="font-medium tracking-wide">Reminders</span>
                </a>
                <a href="statistics.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70 group-hover:opacity-100 transition-opacity">📊</span><span class="font-medium tracking-wide">Statistics</span>
                </a>
                <a href="inactive.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70 group-hover:opacity-100 transition-opacity">⚠️</span><span class="font-medium tracking-wide">Inactive</span>
                </a>
                <a href="alerts.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70 group-hover:opacity-100 transition-opacity">🚨</span><span class="font-medium tracking-wide">Alerts</span>
                </a>
                <div class="my-4 border-t border-gray-800/50"></div>
                <a href="admin_dashboard.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70 group-hover:opacity-100 transition-opacity">⚙️</span><span class="font-medium tracking-wide">Admin</span>
                </a>
            </nav>
            <div class="p-6 border-t border-gray-800/50">
                <button onclick="logout()" class="w-full flex items-center justify-center px-4 py-3 bg-red-500/10 text-red-400 hover:bg-red-600 hover:text-white rounded-xl transition-all duration-200 text-sm font-semibold tracking-wide border border-transparent hover:border-red-500 shadow-sm">Sign Out</button>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-primary/80 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#F3F4F6]">
            <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 h-20 flex items-center justify-between px-8 sticky top-0 z-30 shadow-sm">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-primary focus:outline-none p-2 mr-4 transition-colors">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 tracking-tight" id="page-title">New Patient Registration</h2>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 md:p-10 space-y-8 scroll-smooth">
                <div class="max-w-5xl mx-auto">
                    <form id="medMitraForm" class="space-y-8">
                        <!-- Patient Details -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 relative group hover:shadow-md transition-shadow">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-secondary"></div>
                            <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
                                <span class="bg-secondary/10 p-2 rounded-lg text-secondary">👤</span> Patient Details
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">OPD Number</label>
                                    <input type="text" id="opdNo" required class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Full Name</label>
                                    <input type="text" id="patientName" required class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Contact Number</label>
                                    <input type="text" id="contactNumber" required class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Reminder Language</label>
                                    <select id="language" class="block w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all appearance-none">
                                        <option value="en">English</option>
                                        <option value="hi">Hindi</option>
                                        <option value="gu">Gujarati</option>
                                        <option value="bn">Bengali</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Clinical Info -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 relative group">
                             <div class="absolute top-0 left-0 w-1.5 h-full bg-quaternary"></div>
                             <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">🩺 Clinical Info</h3>
                             
                             <!-- Chief Complaints -->
                             <div class="mb-8">
                                <div class="flex justify-between items-center mb-4">
                                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Chief Complaints</label>
                                    <button type="button" onclick="addClinicalRow('complaints-container', 'complaint')" class="text-xs font-bold text-secondary hover:text-primary transition-colors">+ Add Complaint</button>
                                </div>
                                <div id="complaints-container" class="space-y-3">
                                    <!-- Dynamic Rows -->
                                </div>
                             </div>

                             <!-- Confirmed Diagnosis -->
                             <div>
                                <div class="flex justify-between items-center mb-4">
                                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-1">Confirmed Diagnoses</label>
                                    <button type="button" onclick="addClinicalRow('diagnosis-container', 'diagnosis')" class="text-xs font-bold text-secondary hover:text-primary transition-colors">+ Add Diagnosis</button>
                                </div>
                                <div id="diagnosis-container" class="space-y-3">
                                    <!-- Dynamic Rows -->
                                </div>
                             </div>
                        </div>

                        <!-- Therapy -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 relative group overflow-visible">
                             <div class="absolute top-0 left-0 w-1.5 h-full bg-tertiary"></div>
                             <div class="flex justify-between items-center mb-6">
                                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">💊 Therapy Regimen</h3>
                                <button type="button" onclick="addTherapyRow()" class="px-4 py-2 bg-secondary/10 text-secondary border border-secondary/20 rounded-lg text-sm font-bold transition-all">+ Add Drug</button>
                            </div>
                            <div class="overflow-x-auto rounded-xl border border-gray-200">
                                <table id="therapyTable" class="w-full text-left border-collapse min-w-[700px]">
                                    <thead>
                                        <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider font-semibold border-b border-gray-200">
                                            <th class="px-5 py-4">Drug Name</th>
                                            <th class="px-5 py-4">Dose</th>
                                            <th class="px-5 py-4">Schedule</th>
                                            <th class="px-5 py-4">End Date</th>
                                            <th class="px-5 py-4 text-center">Safety</th>
                                            <th class="px-5 py-4 text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 bg-white"></tbody>
                                </table>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-primary text-quaternary font-bold py-4 rounded-xl shadow-lg hover:shadow-2xl transition-all transform hover:-translate-y-0.5 tracking-wide text-lg">Generate QR & Register</button>
                    </form>

                    <div id="message" class="hidden mt-8 p-6 rounded-xl text-center text-sm font-bold border fade-in"></div>

                    <div id="qr-container" class="hidden mt-10 text-center bg-white p-10 rounded-3xl border border-gray-100 shadow-xl fade-in relative overflow-hidden">
                        <h3 class="text-2xl font-bold text-gray-800 mb-2">Scan to Activate</h3>
                        <div class="flex justify-center mb-8"><div id="qrcode" class="p-6 bg-white rounded-2xl shadow-lg border border-gray-100 relative z-10"></div></div>
                        <div id="status-text" class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-secondary/10 text-secondary font-bold animate-pulse">Waiting for patient consent...</div>
                    </div>
                </div>
            </main>
        </div>
    <div id="safety-modal" class="fixed inset-0 z-[60] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900/75 backdrop-blur-sm transition-opacity" onclick="document.getElementById('safety-modal').classList.add('hidden')"></div>
        <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg" onclick="event.stopPropagation()">
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
                                <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                                </svg>
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                                <h3 class="text-lg font-bold leading-6 text-gray-900" id="modal-title">Safety Profile</h3>
                                <div id="safety-content" class="mt-4 space-y-4">
                                    <!-- Content injected via JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="button" class="mt-3 inline-flex w-full justify-center rounded-xl bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto" onclick="document.getElementById('safety-modal').classList.add('hidden')">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
        function logout() { 
            console.log('Logging out...');
            localStorage.removeItem('auth_token');
            window.location.href = './login.html'; 
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('auth_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        /* --- Application Logic --- */
        let pollingInterval = null;
        let rowCount = 0;
        let clinicalRowCount = 0;
        const botUsername = CONFIG.BOT_USERNAME;
        const icdCache = {}; // Client-side flash cache

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        const searchICD = debounce(async (input, listId, codeId) => {
            const term = input.value.trim();
            const list = document.getElementById(listId);
            
            if (term.length < 3) { 
                list.classList.add('hidden'); 
                return; 
            }

            // Check Cache
            if (icdCache[term]) {
                renderICDResults(icdCache[term], list, input.id, codeId, listId);
                return;
            }

            // Show Loading State
            list.innerHTML = '<li class="px-5 py-3 text-sm text-gray-400 italic">Searching...</li>';
            list.classList.remove('hidden');

            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/api/medmitra/icd/search?q=${encodeURIComponent(term)}`, { 
                    credentials: 'include',
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    icdCache[term] = data; // Save to cache
                    renderICDResults(data, list, input.id, codeId, listId);
                } else {
                    list.classList.add('hidden');
                }
            } catch (e) { 
                console.error(e);
                list.classList.add('hidden');
            }
        }, 350); // Faster debounce

        function renderICDResults(data, list, inputId, codeId, listId) {
            if (data.length > 0) {
                list.innerHTML = data.map(item => `
                    <li onclick="selectICD('${item.title.replace(/'/g, "\\'")}', '${item.code}', '${listId}', '${inputId}', '${codeId}')" 
                        class="px-5 py-3 hover:bg-gray-50 cursor-pointer text-sm border-b border-gray-100 last:border-none">
                        <div class="font-medium text-gray-800">${item.title}</div>
                        <div class="text-[10px] text-secondary font-bold font-mono mt-0.5">${item.code}</div>
                    </li>
                `).join('');
                list.classList.remove('hidden');
            } else {
                list.innerHTML = '<li class="px-5 py-3 text-sm text-gray-400">No specific codes found</li>';
            }
        }

        function addClinicalRow(containerId, type) {
            const container = document.getElementById(containerId);
            const id = clinicalRowCount++;
            const div = document.createElement('div');
            div.className = "flex gap-3 relative animate-[fadeIn_0.2s_ease-out]";
            div.innerHTML = `
                <div class="flex-1 relative">
                    <input type="text" id="input-${type}-${id}" 
                           placeholder="${type === 'complaint' ? 'Symptom...' : 'Diagnosis...'}" 
                           onkeyup="searchICD(this, 'list-${type}-${id}', 'code-${type}-${id}')" 
                           autocomplete="off" required 
                           class="clinical-title block w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary text-sm transition-all">
                    <input type="hidden" class="clinical-code" id="code-${type}-${id}">
                    <ul id="list-${type}-${id}" class="suggestions-list absolute z-50 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-2xl max-h-48 overflow-y-auto hidden"></ul>
                </div>
                <div class="w-32">
                    <input type="text" placeholder="Duration" 
                           class="clinical-duration block w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary text-sm transition-all">
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-red-500 p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"></path></svg>
                </button>
            `;
            container.appendChild(div);
        }

        // Initialize with one row each
        window.addEventListener('DOMContentLoaded', () => {
            addClinicalRow('complaints-container', 'complaint');
            addClinicalRow('diagnosis-container', 'diagnosis');
        });

        const searchDrug = debounce(async (input, id) => {
            const term = input.value;
            const list = document.getElementById(`suggestions-${id}`);
            if (term.length < 2) { list.classList.add('hidden'); return; }
            try {
                const [localRes, globalRes] = await Promise.all([
                    fetch(`${CONFIG.API_BASE_URL}/api/medmitra/rxnorm/formulary?q=${encodeURIComponent(term)}`, { 
                        credentials: 'include',
                        headers: getAuthHeaders()
                    }),
                    fetch(`${CONFIG.API_BASE_URL}/api/medmitra/rxnorm/search?q=${encodeURIComponent(term)}`, { 
                        credentials: 'include',
                        headers: getAuthHeaders()
                    })
                ]);
                const localData = await localRes.json();
                const globalData = await globalRes.json();
                
                const safeLocalData = Array.isArray(localData) ? localData : [];
                const safeGlobalData = Array.isArray(globalData) ? globalData : [];

                const results = [...safeLocalData.map(d => ({ ...d, source: 'Formulary' })), ...safeGlobalData.filter(g => !safeLocalData.some(l => l.rxcui === g.rxcui)).map(d => ({ ...d, source: 'Global' }))].slice(0, 10);
                if (results.length > 0) {
                    list.innerHTML = results.map(d => `<li onclick="selectDrug(this, ${id}, '${d.drug_name}', '${d.rxcui}', '${d.brand_name || ''}')" class="px-4 py-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-none flex justify-between items-center"><div class="text-sm"><b>${d.drug_name}</b><br><small>${d.brand_name}</small></div><span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-md ${d.source === 'Formulary' ? 'bg-secondary/10 text-secondary' : 'bg-gray-100 text-gray-500'}">${d.source}</span></li>`).join('');
                    list.classList.remove('hidden');
                } else { list.classList.add('hidden'); }
            } catch (e) { console.error(e); }
        }, 300);

        function selectICD(title, code, listId, inputId, codeId) {
            document.getElementById(inputId).value = title;
            document.getElementById(codeId).value = code;
            document.getElementById(listId).classList.add('hidden');
        }

        function addTherapyRow() {
            const table = document.getElementById('therapyTable').getElementsByTagName('tbody')[0];
            const row = table.insertRow();
            const id = rowCount++;
            row.className = "hover:bg-gray-50/50 transition-colors group animate-[fadeIn_0.3s_ease-in-out]";
            row.innerHTML = `<td class="px-5 py-3 relative align-top"><input type="text" placeholder="Drug..." onkeyup="searchDrug(this, ${id})" autocomplete="off" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary text-sm"><ul id="suggestions-${id}" class="suggestions-list absolute z-50 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-2xl max-h-48 overflow-y-auto hidden left-0 ring-1 ring-black/5"></ul><input type="hidden" class="rxcui-hidden"></td><td class="px-5 py-3 align-top"><input list="doses-${id}" type="text" placeholder="500mg" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary text-sm"><datalist id="doses-${id}"></datalist></td><td class="px-5 py-3 align-top"><input type="text" placeholder="09:00, 21:00" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary text-sm"></td><td class="px-5 py-3 align-top"><input type="date" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary/20 focus:border-secondary text-sm"></td><td class="px-5 py-3 text-center align-top pt-3"><button type="button" disabled class="text-gray-300 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50" onclick="showSafetyInfo(this)"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></button></td><td class="px-5 py-3 text-center align-top pt-4"><button type="button" onclick="this.closest('tr').remove()" class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-red-50"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"></path></svg></button></td>`;
        }

        async function selectDrug(li, id, name, rxcui, brand) {
            const row = li.closest('td');
            const tr = li.closest('tr');
            const input = row.querySelector('input[type="text"]');
            const hidden = row.querySelector('.rxcui-hidden');
            const list = row.querySelector('ul');
            const doseList = document.getElementById(`doses-${id}`);
            input.value = name + (brand ? ` (${brand})` : '');
            hidden.value = rxcui;
            list.classList.add('hidden');

            // Enable Safety Button
            const safetyBtn = tr.querySelector('button[onclick="showSafetyInfo(this)"]');
            if (safetyBtn) {
                safetyBtn.dataset.drugName = name;
                safetyBtn.dataset.rxcui = rxcui; // Store RxCUI for accurate safety lookup
                safetyBtn.disabled = false;
                safetyBtn.classList.remove('text-gray-300');
                safetyBtn.classList.add('text-red-500');
            }

            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/api/medmitra/rxnorm/details/${rxcui}`, { 
                    credentials: 'include',
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                if (data.available_doses) doseList.innerHTML = data.available_doses.map(d => `<option value="${d}">`).join('');
                
                // Pre-fetch ingredient name for safety modal if possible (optimization)
                if (data.ingredient_name && safetyBtn) {
                    safetyBtn.dataset.ingredient = data.ingredient_name;
                }
            } catch (e) { console.error(e); }
        }

        async function showSafetyInfo(btn) {
            const drugName = btn.dataset.drugName;
            const rxcui = btn.dataset.rxcui;
            let searchTerm = btn.dataset.ingredient; // Use cached ingredient if available

            if (!drugName) return;
            
            const modal = document.getElementById('safety-modal');
            const content = document.getElementById('safety-content');
            const title = document.getElementById('modal-title');
            
            title.textContent = `Safety Profile: ${drugName}`;
            modal.classList.remove('hidden');
            content.innerHTML = '<div class="text-center py-8"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mx-auto"></div><p class="mt-2 text-sm text-gray-500">Querying OpenFDA...</p></div>';

            try {
                // If we don't have the ingredient name yet, try to get it
                if (!searchTerm && rxcui && rxcui !== 'null' && rxcui !== 'undefined') {
                     try {
                        const res = await fetch(`${CONFIG.API_BASE_URL}/api/medmitra/rxnorm/details/${rxcui}`, { 
                             credentials: 'include',
                             headers: getAuthHeaders()
                         });
                         const data = await res.json();
                         if (data.ingredient_name) searchTerm = data.ingredient_name;
                     } catch (err) { console.warn("Failed to fetch ingredient details", err); }
                }

                // Fallback: If still no ingredient, use the raw name but clean it up
                if (!searchTerm) {
                    // Heuristic: Remove common dosage forms to improve "fuzzy" matching chances (though OpenFDA is strict)
                    searchTerm = drugName.replace(/\s(TAB|CAP|SYP|INJ|DROPS|OINT|GEL|CREAM|LOTION|SOL|SUSP|15ML|10ML|5ML|100ML|500MG|100MG|50MG|10MG|5MG|1MG)\b/gi, '').trim();
                }

                const term = encodeURIComponent(searchTerm);
                console.log(`[OpenFDA] Searching for: ${searchTerm}`);

                // Parallel fetch for events and deaths
                const [eventsRes, deathRes] = await Promise.all([
                    fetch(`https://api.fda.gov/drug/event.json?search=patient.drug.medicinalproduct:"${term}"&count=patient.reaction.reactionmeddrapt.exact&limit=5`),
                    fetch(`https://api.fda.gov/drug/event.json?search=patient.drug.medicinalproduct:"${term}"+AND+seriousnessdeath:1&count=patient.reaction.reactionmeddrapt.exact&limit=5`)
                ]);

                // Handle 404s gracefully (no data found)
                const events = eventsRes.ok ? await eventsRes.json() : { results: [] };
                const deaths = deathRes.ok ? await deathRes.json() : { results: [] };

                renderSafetyModal(events.results, deaths.results, searchTerm);
            } catch (e) {
                content.innerHTML = `<div class="text-center py-8 text-red-500"><p>Failed to load data from OpenFDA.</p><p class="text-xs text-gray-400 mt-1">${e.message}</p></div>`;
            }
        }

        function renderSafetyModal(events, deaths, termUsed) {
            const content = document.getElementById('safety-content');
            
            const renderList = (items, emptyMsg, color) => {
                if (!items || items.length === 0) return `<p class="text-sm text-gray-400 italic">${emptyMsg}</p>`;
                const max = Math.max(...items.map(i => i.count));
                return items.map(i => `
                    <div class="flex items-center justify-between text-sm mb-1">
                        <span class="capitalize text-gray-700 font-medium">${i.term.toLowerCase()}</span>
                        <span class="text-xs font-bold ${color}">${i.count}</span>
                    </div>
                    <div class="w-full bg-gray-100 rounded-full h-1.5 mb-3">
                        <div class="${color.replace('text', 'bg')} h-1.5 rounded-full" style="width: ${(i.count / max) * 100}%"></div>
                    </div>
                `).join('');
            };

            content.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-blue-50 px-3 py-2 rounded-lg text-xs text-blue-700 mb-2">
                        <strong>Search Term:</strong> ${termUsed}
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Most Reported Side Effects</h4>
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            ${renderList(events, "No data available.", "text-blue-500")}
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-red-500 uppercase tracking-wider mb-3 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Reported Adverse Events (Lethal)
                        </h4>
                        <div class="bg-red-50 p-4 rounded-xl border border-red-100">
                            ${renderList(deaths, "No lethal events reported.", "text-red-500")}
                        </div>
                    </div>
                    <div class="text-[10px] text-gray-400 text-center border-t border-gray-100 pt-3">
                        Source: openFDA API. Data is based on reported events and does not establish causality.
                    </div>
                </div>
            `;
        }

        document.getElementById('medMitraForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            const qrContainer = document.getElementById('qr-container');
            const qrCodeDiv = document.getElementById('qrcode');
            const statusText = document.getElementById('status-text');
            messageDiv.classList.add('hidden');
            qrContainer.classList.add('hidden');
            qrCodeDiv.innerHTML = '';
            if (pollingInterval) clearInterval(pollingInterval);
            const opdNo = document.getElementById('opdNo').value;
            
            // Collect Clinical Info
            const complaints = Array.from(document.getElementById('complaints-container').children).map(row => ({
                title: row.querySelector('.clinical-title').value,
                code: row.querySelector('.clinical-code').value,
                duration: row.querySelector('.clinical-duration').value
            })).filter(c => c.title);

            const diagnoses = Array.from(document.getElementById('diagnosis-container').children).map(row => ({
                title: row.querySelector('.clinical-title').value,
                code: row.querySelector('.clinical-code').value,
                duration: row.querySelector('.clinical-duration').value
            })).filter(d => d.title);

            const therapies = [];
            const rows = document.getElementById('therapyTable').getElementsByTagName('tbody')[0].rows;
            for (let i = 0; i < rows.length; i++) {
                const inputs = rows[i].getElementsByTagName('input');
                // inputs[0]=Drug, inputs[1]=HiddenRXCUI, inputs[2]=Dose, inputs[3]=Schedule, inputs[4]=Date
                therapies.push({ 
                    drug: inputs[0].value, 
                    dose: inputs[2].value, 
                    scheduleTimes: inputs[3].value.split(',').map(t => t.trim()), 
                    endDate: inputs[4].value 
                });
            }
            const data = { 
                opdNo, 
                patientName: document.getElementById('patientName').value, 
                contactNumber: document.getElementById('contactNumber').value, 
                language: document.getElementById('language').value,
                complaints,
                diagnoses,
                therapies 
            };
            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/api/medmitra/register`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, 
                    body: JSON.stringify(data), 
                    credentials: 'include' 
                });
                if (res.ok) {
                    qrContainer.classList.remove('hidden');
                    new QRCode(qrCodeDiv, { text: `https://t.me/${botUsername}?start=${opdNo}`, width: 180, height: 180 });
                    pollingInterval = setInterval(async () => {
                        const check = await fetch(`${CONFIG.API_BASE_URL}/api/medmitra/check-consent/${encodeURIComponent(opdNo)}`, { 
                            credentials: 'include',
                            headers: getAuthHeaders()
                        });
                        const checkData = await check.json();
                        if (checkData.consent) {
                            clearInterval(pollingInterval);
                            statusText.innerHTML = "✅ Consent Verified!";
                            statusText.className = "px-4 py-2 rounded-full bg-green-100 text-green-700 font-bold";
                            document.getElementById('medMitraForm').reset();
                        }
                    }, 3000);
                }
            } catch (error) { messageDiv.textContent = 'Error: ' + error.message; messageDiv.classList.remove('hidden'); }
        });
        addTherapyRow();
    </script>
