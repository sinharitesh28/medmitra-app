<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedMitra - Assigned Reminders</title>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/auth-guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#1B211A', secondary: '#628141', tertiary: '#8BAE66', quaternary: '#EBD5AB' }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        thead th { position: sticky; top: 0; z-index: 10; }
        .slide-over { transform: translateX(100%); transition: transform 0.3s ease-out; }
        .slide-over.active { transform: translateX(0); }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-primary text-gray-300 w-64 flex-shrink-0 fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out z-50 flex flex-col shadow-2xl">
            <div class="h-20 flex items-center justify-center border-b border-gray-800/50 bg-primary/50 backdrop-blur-sm">
                <h1 class="text-2xl font-bold tracking-widest text-quaternary flex items-center gap-3">
                    <span class="text-3xl">⚕️</span> MedMitra
                </h1>
            </div>
            <nav class="flex-1 px-4 py-8 space-y-2 overflow-y-auto no-scrollbar">
                <a href="registration.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70">📝</span><span class="font-medium tracking-wide">Registration</span>
                </a>
                <a href="assigned.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70">📅</span><span class="font-medium tracking-wide">Assigned</span>
                </a>
                <a href="reminders.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70">🔔</span><span class="font-medium tracking-wide">Reminders</span>
                </a>
                <a href="statistics.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70">📊</span><span class="font-medium tracking-wide">Statistics</span>
                </a>
                <a href="inactive.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70">⚠️</span><span class="font-medium tracking-wide">Inactive</span>
                </a>
                <a href="alerts.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70">🚨</span><span class="font-medium tracking-wide">Alerts</span>
                </a>
                <div class="my-4 border-t border-gray-800/50"></div>
                <a href="admin_dashboard.html" class="nav-link flex items-center px-4 py-3.5 rounded-xl transition-all duration-200 hover:bg-white/5 hover:text-white group">
                    <span class="text-xl mr-3 opacity-70">⚙️</span><span class="font-medium tracking-wide">Admin</span>
                </a>
            </nav>
            <div class="p-6 border-t border-gray-800/50">
                <button onclick="logout()" class="w-full flex items-center justify-center px-4 py-3 bg-red-500/10 text-red-400 hover:bg-red-600 hover:text-white rounded-xl transition-all duration-200 text-sm font-semibold tracking-wide border border-transparent hover:border-red-500 shadow-sm">Sign Out</button>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-primary/80 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#F3F4F6]">
            <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 h-20 flex items-center justify-between px-8 sticky top-0 z-30 shadow-sm">
                <div class="flex items-center">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-primary focus:outline-none p-2 mr-4 transition-colors">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Treatment Timeline</h2>
                        <p class="text-xs text-gray-500 font-medium mt-0.5">Assigned patient reminders schedule</p>
                    </div>
                </div>
                <div id="user-profile"></div>
            </header>

            <main class="flex-1 overflow-y-auto p-6 md:p-8 space-y-8 scroll-smooth">
                <!-- Date Filter -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200/60 p-4 flex flex-wrap gap-4 items-end">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Start Date</label>
                        <input type="date" id="startDate" class="block px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-secondary/20 focus:border-secondary">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">End Date</label>
                        <input type="date" id="endDate" class="block px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-secondary/20 focus:border-secondary">
                    </div>
                    <button onclick="applyFilter()" class="px-4 py-2 bg-secondary text-white rounded-lg text-sm font-bold shadow-md shadow-secondary/20 hover:bg-secondary/90 transition-all">Filter</button>
                    <button onclick="resetFilter()" class="px-4 py-2 text-gray-500 hover:text-gray-700 text-sm font-medium transition-colors">Reset</button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200/60 overflow-hidden flex flex-col h-[700px]">
                    <div class="p-6 border-b border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4 bg-gray-50/30">
                        <div class="w-full md:w-auto relative group">
                             <input type="text" id="searchInput" placeholder="Search Patient or OPD..." onkeyup="filterTable()" 
                                class="w-full md:w-72 pl-11 pr-4 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary text-sm bg-white transition-all placeholder-gray-400">
                             <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                <span class="text-gray-400 group-focus-within:text-secondary transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                </span>
                             </div>
                        </div>
                    </div>
                    
                    <div class="overflow-auto flex-1">
                        <table id="scheduleTable" class="w-full text-left border-collapse">
                            <thead class="bg-gray-50/80 backdrop-blur-sm border-b border-gray-200">
                                <tr class="text-gray-500 text-xs uppercase tracking-wider font-semibold">
                                    <th class="px-6 py-4 font-bold text-gray-600">Date</th>
                                    <th class="px-6 py-4 font-bold text-gray-600">Time</th>
                                    <th class="px-6 py-4 font-bold text-gray-600">Patient</th>
                                    <th class="px-6 py-4 font-bold text-gray-600">Drug</th>
                                    <th class="px-6 py-4 font-bold text-gray-600">Dose</th>
                                    <th class="px-6 py-4 font-bold text-gray-600">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                                <tr><td colspan="6" class="px-6 py-12 text-center text-gray-400 font-medium">Loading schedule...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Patient Smart View Overlay -->
    <div id="patient-overlay-bg" onclick="closePatientProfile()" class="fixed inset-0 bg-primary/40 backdrop-blur-sm z-[100] hidden transition-opacity duration-300"></div>
    <div id="patient-overlay" class="fixed top-0 right-0 h-full w-full max-w-2xl bg-white z-[101] shadow-2xl slide-over overflow-y-auto flex flex-col">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 sticky top-0 bg-white z-10">
            <div>
                <h3 id="prof-name" class="text-xl font-bold text-gray-800 leading-tight">Patient Profile</h3>
                <p id="prof-opd" class="text-xs text-secondary font-bold font-mono uppercase tracking-widest mt-1"></p>
            </div>
            <button onclick="closePatientProfile()" class="p-2 hover:bg-gray-100 rounded-full transition-colors text-gray-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div id="prof-content" class="p-8 space-y-10">
            <!-- Dynamic Content -->
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
        function logout() { 
            localStorage.removeItem('auth_token');
            window.location.href = './login.html'; 
        }
        function getAuthHeaders() {
            const token = localStorage.getItem('auth_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            if(link.getAttribute('href').includes('assigned.html')) {
                link.classList.add('bg-secondary', 'text-white', 'shadow-lg', 'shadow-secondary/20', 'border-l-4', 'border-quaternary');
            } else { link.classList.add('text-gray-400'); }
        });

        let scheduleData = [];

        async function fetchSchedule() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            let url = `${CONFIG.API_BASE_URL}/api/medmitra/assigned-reminders`;
            if (start) url += `?startDate=${start}&endDate=${end || start}`;

            try {
                const response = await fetch(url, { credentials: 'include', headers: getAuthHeaders() });
                if (response.status === 401) { logout(); return; }
                scheduleData = await response.json();
                renderTable(scheduleData);
            } catch (error) {
                console.error('Error:', error);
                document.querySelector('#scheduleTable tbody').innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-red-500 font-medium">Failed to load schedule.</td></tr>';
            }
        }

        function applyFilter() { fetchSchedule(); }
        function resetFilter() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            fetchSchedule();
        }

        function renderTable(data) {
            const tbody = document.querySelector('#scheduleTable tbody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-gray-500 font-medium">No scheduled reminders found.</td></tr>';
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/50 transition-colors border-b border-gray-50 last:border-none";
                let badgeClass = item.status === 'Upcoming' ? 'bg-blue-50 text-blue-700' : 
                                 item.status === 'Past' ? 'bg-orange-50 text-orange-700' : 'bg-green-50 text-green-700';
                
                tr.innerHTML = `
                    <td class="px-6 py-4 text-sm text-gray-500 font-medium">${item.date}</td>
                    <td class="px-6 py-4 font-bold text-gray-800">${item.time}</td>
                    <td class="px-6 py-4">
                        <button onclick="showPatientProfile('${item.opd_no}')" class="text-secondary font-bold hover:underline text-left">${item.patient_name}</button>
                        <div class="text-[10px] text-gray-400 font-mono">${item.opd_no}</div>
                    </td>
                    <td class="px-6 py-4 text-gray-700 font-medium">${item.drug_name}</td>
                    <td class="px-6 py-4 text-gray-600 text-sm">${item.dose}</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide ${badgeClass} border border-current opacity-80">
                            ${item.status}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function showPatientProfile(opdNo) {
            const bg = document.getElementById('patient-overlay-bg');
            const panel = document.getElementById('patient-overlay');
            const content = document.getElementById('prof-content');
            
            bg.classList.remove('hidden');
            panel.classList.add('active');
            content.innerHTML = '<div class="flex justify-center py-20"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-secondary"></div></div>';

            try {
                const res = await fetch(`${CONFIG.API_BASE_URL}/api/medmitra/patient-profile/${opdNo}`, { credentials: 'include', headers: getAuthHeaders() });
                const data = await res.json();
                
                document.getElementById('prof-name').textContent = data.identity.full_name;
                document.getElementById('prof-opd').textContent = `OPD: ${data.identity.opd_no} | Age: ${data.identity.age || 'N/A'} | Gender: ${data.identity.gender || 'N/A'}`;

                let html = `
                    <!-- Clinical Info -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Complaints</h4>
                            <ul class="space-y-2">
                                ${data.clinical.complaints.map(c => `<li class="text-sm font-semibold text-gray-700 flex justify-between"><span>${c.title}</span><span class="text-gray-400 text-xs">${c.duration || ''}</span></li>`).join('') || '<li class="text-xs italic text-gray-400">None</li>'}
                            </ul>
                        </div>
                        <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Diagnosis</h4>
                            <ul class="space-y-2">
                                ${data.clinical.diagnoses.map(d => `<li class="text-sm font-semibold text-gray-700 flex justify-between"><span>${d.title}</span><span class="text-secondary font-mono text-[10px]">${d.icd_code || ''}</span></li>`).join('') || '<li class="text-xs italic text-gray-400">None</li>'}
                            </ul>
                        </div>
                    </div>

                    <!-- Regimen -->
                    <div>
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Current Regimen</h4>
                        <div class="space-y-3">
                            ${data.therapy.map(t => `
                                <div class="flex items-center justify-between p-4 bg-white border border-gray-100 rounded-xl shadow-sm">
                                    <div>
                                        <div class="text-sm font-bold text-gray-800">${t.drug_name}</div>
                                        <div class="text-xs text-gray-500">${t.dose_instruction} • ${Array.isArray(t.schedule_times) ? t.schedule_times.join(', ') : (typeof t.schedule_times === 'string' ? JSON.parse(t.schedule_times).join(', ') : '')}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-[10px] font-bold text-gray-400 uppercase">End Date</div>
                                        <div class="text-xs font-bold text-secondary">${t.end_date ? new Date(t.end_date).toLocaleDateString() : 'Continuous'}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div>
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Interaction History</h4>
                        <div class="relative pl-6 border-l-2 border-gray-100 space-y-8">
                            ${data.logs.map(l => `
                                <div class="relative">
                                    <div class="absolute -left-[33px] top-1 w-4 h-4 rounded-full border-4 border-white ${l.response === 'TAKEN' ? 'bg-green-500' : l.response === 'REACTION' ? 'bg-red-500' : 'bg-gray-300'} shadow-sm"></div>
                                    <div class="text-xs font-bold text-gray-400">${new Date(l.sent_at).toLocaleString()}</div>
                                    <div class="mt-1 text-sm font-medium text-gray-700">${(l.message_sent || '').split('\n')[0]}</div>
                                    <div class="mt-1 inline-flex items-center px-2 py-0.5 rounded bg-gray-100 text-[10px] font-bold uppercase tracking-tight ${l.response === 'TAKEN' ? 'text-green-700 bg-green-50' : l.response === 'REACTION' ? 'text-red-700 bg-red-50' : 'text-gray-500'}">
                                        Status: ${l.response} ${l.response_at ? 'at ' + new Date(l.response_at).toLocaleTimeString() : ''}
                                    </div>
                                </div>
                            `).join('') || '<div class="text-xs italic text-gray-400">No interaction logs yet.</div>'}
                        </div>
                    </div>
                `;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = '<div class="p-8 text-center text-red-500">Failed to load profile.</div>';
            }
        }

        function closePatientProfile() {
            document.getElementById('patient-overlay-bg').classList.add('hidden');
            document.getElementById('patient-overlay').classList.remove('active');
        }

        function filterTable() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = scheduleData.filter(item => item.patient_name.toLowerCase().includes(term) || item.opd_no.toLowerCase().includes(term));
            renderTable(filtered);
        }

        fetchSchedule();
        setInterval(fetchSchedule, 60000);
    </script>
</body>
</html>
